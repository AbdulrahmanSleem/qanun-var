[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qanun-var-legal-knowledge"
version = "1.0.0"
description = "QANUN-VAR: Egyptian Legal Knowledge Base, Ingestion Pipeline, Hybrid Retrieval, Legal Q&A Agent, and Citation Verifier"
authors = [{ name = "QANUN-VAR AI Team - Member 2" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.1.0",
    "transformers>=4.44.0",
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
